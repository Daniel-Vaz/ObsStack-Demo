apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  namespace: otel-demo
  labels:
    app.kubernetes.io/name: payment
    app.kubernetes.io/part-of: otel-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: payment
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payment
        app.kubernetes.io/part-of: otel-demo
        scrape: metrics
      annotations:
        pyroscope.io/scrape: "true"
    spec:
      containers:
        - name: payment
          image: localhost/otel-demo/payment:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://alloy.observability.svc.cluster.local:4317
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: grpc
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          resources:
            requests: { cpu: 50m, memory: 32Mi }   # burns CPU on /pay
---
apiVersion: v1
kind: Service
metadata:
  name: payment
  namespace: otel-demo
  labels:
    app.kubernetes.io/name: payment
    app.kubernetes.io/part-of: otel-demo
spec:
  selector:
    app.kubernetes.io/name: payment
  ports:
    - name: http
      port: 8080
      targetPort: http
