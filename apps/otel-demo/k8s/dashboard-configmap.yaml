# Curated app-health dashboard for the demo. The Grafana sidecar (enabled in
# helm/grafana/values.yaml, searchNamespace: ALL) auto-loads any ConfigMap
# labelled grafana_dashboard=1, so this needs no change to the Grafana release.
#
# Panels are grouped into rows - Health overview, Traffic, Errors, Latency, and
# Runtime & resources - and driven by the metrics the app exposes on /metrics:
#   demo_orders_total / demo_order_errors_total (frontend), demo_payment_failures_total
#   (payment), otelhttp RED histograms (http_server_request_duration_seconds_*),
#   and the Go runtime / process collectors. Services are separated by the
#   `container` label; the $service template variable filters the per-service panels.
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-demo-dashboard
  namespace: otel-demo
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: otel-demo
data:
  otel-demo.json: |
    {
      "title": "OTel Demo - App Health",
      "uid": "otel-demo-red",
      "tags": [
        "otel-demo",
        "red",
        "health"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "graphTooltip": 1,
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "refresh": "10s",
      "templating": {
        "list": [
          {
            "name": "service",
            "type": "query",
            "label": "Service",
            "datasource": {
              "type": "prometheus",
              "uid": "mimir"
            },
            "query": {
              "query": "label_values(http_server_request_duration_seconds_count, container)",
              "refId": "StandardVariableQuery"
            },
            "refresh": 2,
            "sort": 1,
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "current": {
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "options": [],
            "hide": 0
          }
        ]
      },
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Health overview",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Orders / sec",
          "datasource": {
            "type": "prometheus",
            "uid": "mimir"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "mappings": [],
              "decimals": 2
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "showPercentChange": false,
            "wideLayout": true
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(demo_orders_total[$__rate_interval]))",
              "legendFormat": "orders/s",
              "datasource": {
