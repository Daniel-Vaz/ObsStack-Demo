# kind cluster for the Grafana LGTM demo.
# Single control-plane node keeps the footprint minimal. The web UIs are
# exposed as NodePort services; these extraPortMappings publish the node
# ports on the host so the UIs are reachable at http://localhost:<port> with
# no port-forward (works on WSL2 + rootless Podman, where the container
# network itself isn't host-routable). The nodePorts match helm/*/values.yaml
# — except kagent UI's, which is a supplementary Service
# (helm/kagent/kagent-ui-nodeport.yaml) alongside the kagent chart, which has
# no pinned-nodePort field of its own.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: observability-demo
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30000   # Grafana UI       -> http://localhost:3000
        hostPort: 3000
      - containerPort: 30345   # Alloy UI         -> http://localhost:12345
        hostPort: 12345
      - containerPort: 30090   # Prometheus UI    -> http://localhost:9090
        hostPort: 9090
      - containerPort: 30093   # Alertmanager UI  -> http://localhost:9093
        hostPort: 9093
      - containerPort: 30080   # otel-demo web UI -> http://localhost:8080
        hostPort: 8080
      - containerPort: 30466   # Headlamp UI      -> http://localhost:4466
        hostPort: 4466
      - containerPort: 30081   # Karma alert UI   -> http://localhost:8081
        hostPort: 8081
      - containerPort: 30890   # kagent UI        -> http://localhost:8090
        hostPort: 8090
