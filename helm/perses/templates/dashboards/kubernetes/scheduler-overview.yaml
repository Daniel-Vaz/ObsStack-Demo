# Vendored from perses/community-mixins @ cf419605e54868c45608cd590f47a150358da7a5
# https://github.com/perses/community-mixins/blob/cf419605e54868c45608cd590f47a150358da7a5/examples/dashboards/operator/kubernetes/scheduler-overview.yaml
# Rewritten from v1alpha1 to v1alpha2 by scripts/vendor-perses-dashboards.py — do not hand-edit.
apiVersion: perses.dev/v1alpha2
kind: PersesDashboard
metadata:
  labels:
    app.kubernetes.io/component: dashboard
    app.kubernetes.io/instance: scheduler-overview
    app.kubernetes.io/name: perses-dashboard
    app.kubernetes.io/part-of: perses-operator
  name: scheduler-overview
  namespace: {{ .Release.Namespace }}
spec:
  instanceSelector:
    matchLabels:
      perses-instance: {{ .Release.Name }}
  config:
    display:
      name: Kubernetes / Scheduler
    duration: 1h
    layouts:
    - kind: Grid
      spec:
        display:
          title: Scheduler Status
        items:
        - content:
            $ref: '#/spec/panels/0_0'
          height: 8
          width: 24
          x: 0
          'y': 0
    - kind: Grid
      spec:
        display:
          title: Scheduling Rate
        items:
        - content:
            $ref: '#/spec/panels/1_0'
          height: 8
          width: 12
          x: 0
          'y': 0
        - content:
            $ref: '#/spec/panels/1_1'
          height: 8
          width: 12
          x: 12
          'y': 0
    - kind: Grid
      spec:
        display:
          title: Kube API Requests
        items:
        - content:
            $ref: '#/spec/panels/2_0'
          height: 8
          width: 8
          x: 0
          'y': 0
        - content:
            $ref: '#/spec/panels/2_1'
          height: 8
          width: 8
          x: 8
          'y': 0
        - content:
            $ref: '#/spec/panels/2_2'
          height: 8
          width: 8
          x: 16
          'y': 0
    - kind: Grid
      spec:
        display:
          title: Resource Usage
        items:
        - content:
            $ref: '#/spec/panels/3_0'
          height: 8
          width: 12
          x: 0
          'y': 0
        - content:
            $ref: '#/spec/panels/3_1'
          height: 8
          width: 12
          x: 12
          'y': 0
        - content:
            $ref: '#/spec/panels/3_2'
          height: 8
          width: 12
          x: 0
          'y': 8
        - content:
            $ref: '#/spec/panels/3_3'
          height: 8
          width: 12
          x: 12
          'y': 8
    panels:
      '0_0':
        kind: Panel
        spec:
          display:
            description: Shows the status of the scheduler.
            name: Up
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
              valueFontSize: 50
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus-datasource
                  query: sum(up{cluster="$cluster",job="kube-scheduler"})
      '1_0':
        kind: Panel
        spec:
          display:
            description: Shows the rate of scheduling events.
            name: Scheduling Rate
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
                size: small
              visual:
                areaOpacity: 0.5
                display: line
                lineWidth: 0.25
                palette:
                  mode: auto
              yAxis:
                format:
                  unit: ops/sec
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus-datasource
                  query: "sum by (cluster, instance) (\n  rate(\n    scheduler_e2e_scheduling_duration_seconds_count{cluster=\"\
                    $cluster\",instance=~\"$instance\",job=\"kube-scheduler\"}[$__rate_interval]\n  )\n\
                    )"
                  seriesNameFormat: '{{"{{"}}cluster{{"}}"}} {{"{{"}}instance{{"}}"}} e2e'
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus-datasource
                  query: "sum by (cluster, instance) (\n  rate(\n    scheduler_binding_duration_seconds_count{cluster=\"\
                    $cluster\",instance=~\"$instance\",job=\"kube-scheduler\"}[$__rate_interval]\n  )\n\
                    )"
                  seriesNameFormat: '{{"{{"}}cluster{{"}}"}} {{"{{"}}instance{{"}}"}} binding'
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus-datasource
                  query: "sum by (cluster, instance) (\n  rate(\n    scheduler_scheduling_algorithm_duration_seconds_count{cluster=\"\
                    $cluster\",instance=~\"$instance\",job=\"kube-scheduler\"}[$__rate_interval]\n  )\n\
                    )"
                  seriesNameFormat: '{{"{{"}}cluster{{"}}"}} {{"{{"}}instance{{"}}"}} scheduling algorithm'
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus-datasource
                  query: "sum by (cluster, instance) (\n  rate(\n    scheduler_volume_scheduling_duration_seconds_count{cluster=\"\
                    $cluster\",instance=~\"$instance\",job=\"kube-scheduler\"}[$__rate_interval]\n  )\n\
                    )"
                  seriesNameFormat: '{{"{{"}}cluster{{"}}"}} {{"{{"}}instance{{"}}"}} volume'
      '1_1':
        kind: Panel
        spec:
          display:
            description: Shows the 99th quantile latency of scheduling events.
            name: Scheduling Latency 99th Quantile
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
                size: small
              visual:
                areaOpacity: 0.5
                display: line
                lineWidth: 0.25
                palette:
                  mode: auto
              yAxis:
                format:
                  unit: seconds
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus-datasource
                  query: "histogram_quantile(\n  0.99,\n  sum by (cluster, instance, le) (\n    rate(\n\
                    \      scheduler_e2e_scheduling_duration_seconds_bucket{cluster=\"$cluster\",instance=~\"\
                    $instance\",job=\"kube-scheduler\"}[$__rate_interval]\n    )\n  )\n)"
                  seriesNameFormat: '{{"{{"}}cluster{{"}}"}} {{"{{"}}instance{{"}}"}} e2e'
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus-datasource
                  query: "histogram_quantile(\n  0.99,\n  sum by (cluster, instance, le) (\n    rate(\n\
                    \      scheduler_binding_duration_seconds_bucket{cluster=\"$cluster\",instance=~\"\
                    $instance\",job=\"kube-scheduler\"}[$__rate_interval]\n    )\n  )\n)"
                  seriesNameFormat: '{{"{{"}}cluster{{"}}"}} {{"{{"}}instance{{"}}"}} binding'
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus-datasource
                  query: "histogram_quantile(\n  0.99,\n  sum by (cluster, instance, le) (\n    rate(\n\
                    \      scheduler_scheduling_algorithm_duration_seconds_bucket{cluster=\"$cluster\"\
                    ,instance=~\"$instance\",job=\"kube-scheduler\"}[$__rate_interval]\n    )\n  )\n)"
                  seriesNameFormat: '{{"{{"}}cluster{{"}}"}} {{"{{"}}instance{{"}}"}} scheduling algorithm'
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus-datasource
                  query: "histogram_quantile(\n  0.99,\n  sum by (cluster, instance, le) (\n    rate(\n\
                    \      scheduler_volume_scheduling_duration_seconds_bucket{cluster=\"$cluster\",instance=~\"\
                    $instance\",job=\"kube-scheduler\"}[$__rate_interval]\n    )\n  )\n)"
                  seriesNameFormat: '{{"{{"}}cluster{{"}}"}} {{"{{"}}instance{{"}}"}} volume'
      '2_0':
        kind: Panel
        spec:
          display:
            description: Shows the rate of requests to the Kube API.
            name: Kube API Request Rate
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
                size: small
              visual:
                areaOpacity: 1
                display: line
                lineWidth: 0.25
                palette:
                  mode: auto
                stack: all
              yAxis:
                format:
                  unit: requests/sec
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus-datasource
                  query: "sum(\n  rate(\n    rest_client_requests_total{cluster=~\"$cluster\",code=~\"\
                    2..\",instance=~\"$instance\",job=\"kube-scheduler\"}[$__rate_interval]\n  )\n)"
                  seriesNameFormat: 2xx
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus-datasource
                  query: "sum(\n  rate(\n    rest_client_requests_total{cluster=~\"$cluster\",code=~\"\
                    3..\",instance=~\"$instance\",job=\"kube-scheduler\"}[$__rate_interval]\n  )\n)"
                  seriesNameFormat: 3xx
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus-datasource
                  query: "sum(\n  rate(\n    rest_client_requests_total{cluster=~\"$cluster\",code=~\"\
                    4..\",instance=~\"$instance\",job=\"kube-scheduler\"}[$__rate_interval]\n  )\n)"
                  seriesNameFormat: 4xx
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus-datasource
                  query: "sum(\n  rate(\n    rest_client_requests_total{cluster=~\"$cluster\",code=~\"\
                    5..\",instance=~\"$instance\",job=\"kube-scheduler\"}[$__rate_interval]\n  )\n)"
                  seriesNameFormat: 5xx
      '2_1':
        kind: Panel
        spec:
          display:
            description: Shows the 99th quantile latency of post requests to the Kube API.
            name: Post Request Latency 99th Quantile
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
                size: small
              visual:
                areaOpacity: 0.5
                display: line
                lineWidth: 0.25
                palette:
                  mode: auto
              yAxis:
                format:
                  unit: seconds
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus-datasource
                  query: "histogram_quantile(\n  0.99,\n  sum by (verb, le) (\n    rate(\n      rest_client_request_duration_seconds_bucket{cluster=~\"\
                    $cluster\",instance=~\"$instance\",job=\"kube-scheduler\",verb=\"POST\"}[$__rate_interval]\n\
                    \    )\n  )\n)"
                  seriesNameFormat: '{{"{{"}}verb{{"}}"}}'
      '2_2':
        kind: Panel
        spec:
          display:
            description: Shows the 99th quantile latency of get requests to the Kube API.
            name: Get Request Latency 99th Quantile
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
                size: small
              visual:
                areaOpacity: 0.5
                display: line
                lineWidth: 0.25
                palette:
                  mode: auto
              yAxis:
                format:
                  unit: seconds
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus-datasource
                  query: "histogram_quantile(\n  0.99,\n  sum by (verb, le) (\n    rate(\n      rest_client_request_duration_seconds_bucket{cluster=~\"\
                    $cluster\",instance=~\"$instance\",job=\"kube-scheduler\",verb=\"GET\"}[$__rate_interval]\n\
                    \    )\n  )\n)"
                  seriesNameFormat: '{{"{{"}}verb{{"}}"}}'
      '3_0':
        kind: Panel
        spec:
          display:
            description: Shows various memory usage metrics of the component.
            name: Memory Usage
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - last
              visual:
                areaOpacity: 0.5
                display: line
                lineWidth: 0.25
                palette:
                  mode: auto
              yAxis:
                format:
                  unit: bytes
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus-datasource
                  query: go_memstats_alloc_bytes{cluster=~"$cluster",instance=~"$instance",job="kube-scheduler"}
                  seriesNameFormat: Alloc All {{"{{"}}instance{{"}}"}}
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus-datasource
                  query: go_memstats_heap_alloc_bytes{cluster=~"$cluster",instance=~"$instance",job="kube-scheduler"}
                  seriesNameFormat: Alloc Heap {{"{{"}}instance{{"}}"}}
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus-datasource
                  query: "rate(\n  go_memstats_alloc_bytes_total{cluster=~\"$cluster\",instance=~\"$instance\"\
                    ,job=\"kube-scheduler\"}[$__rate_interval]\n)"
                  seriesNameFormat: Alloc Rate All {{"{{"}}instance{{"}}"}}
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus-datasource
                  query: "rate(\n  go_memstats_heap_alloc_bytes{cluster=~\"$cluster\",instance=~\"$instance\"\
                    ,job=\"kube-scheduler\"}[$__rate_interval]\n)"
                  seriesNameFormat: Alloc Rate Heap {{"{{"}}instance{{"}}"}}
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus-datasource
                  query: go_memstats_stack_inuse_bytes{cluster=~"$cluster",instance=~"$instance",job="kube-scheduler"}
                  seriesNameFormat: Inuse Stack {{"{{"}}instance{{"}}"}}
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus-datasource
                  query: go_memstats_heap_inuse_bytes{cluster=~"$cluster",instance=~"$instance",job="kube-scheduler"}
                  seriesNameFormat: Inuse Heap {{"{{"}}instance{{"}}"}}
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus-datasource
                  query: process_resident_memory_bytes{cluster=~"$cluster",instance=~"$instance",job="kube-scheduler"}
                  seriesNameFormat: Resident Memory {{"{{"}}instance{{"}}"}}
      '3_1':
        kind: Panel
        spec:
          display:
            description: Shows the CPU usage of the component.
            name: CPU Usage
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - last
              visual:
                areaOpacity: 0.5
                display: line
                lineWidth: 0.25
                palette:
                  mode: auto
              yAxis:
                format:
                  unit: decimal
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus-datasource
                  query: "rate(\n  process_cpu_seconds_total{cluster=~\"$cluster\",instance=~\"$instance\"\
                    ,job=\"kube-scheduler\"}[$__rate_interval]\n)"
                  seriesNameFormat: '{{"{{"}}instance{{"}}"}}'
      '3_2':
        kind: Panel
        spec:
          display:
            description: Shows the number of goroutines being used by the component.
            name: Goroutines
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - last
              visual:
                areaOpacity: 0.5
                display: line
                lineWidth: 0.25
                palette:
                  mode: auto
              yAxis:
                format:
                  unit: decimal
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus-datasource
                  query: go_goroutines{cluster=~"$cluster",instance=~"$instance",job="kube-scheduler"}
                  seriesNameFormat: '{{"{{"}}instance{{"}}"}}'
      '3_3':
        kind: Panel
        spec:
          display:
            description: Shows the Go garbage collection pause durations for the component.
            name: GC Duration
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - last
              visual:
                areaOpacity: 0.5
                display: line
                lineWidth: 0.25
                palette:
                  mode: auto
              yAxis:
                format:
                  unit: seconds
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus-datasource
                  query: go_gc_duration_seconds{cluster=~"$cluster",instance=~"$instance",job="kube-scheduler"}
                  seriesNameFormat: '{{"{{"}}quantile{{"}}"}} - {{"{{"}}instance{{"}}"}}'
    variables:
    - kind: ListVariable
      spec:
        allowAllValue: false
        allowMultiple: false
        display:
          hidden: false
          name: cluster
        name: cluster
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource:
              kind: PrometheusDatasource
              name: prometheus-datasource
            labelName: cluster
            matchers:
            - up{job="kube-scheduler"}
    - kind: ListVariable
      spec:
        allowAllValue: false
        allowMultiple: false
        display:
          hidden: false
          name: instance
        name: instance
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource:
              kind: PrometheusDatasource
              name: prometheus-datasource
            labelName: instance
            matchers:
            - up{cluster="$cluster",job="kube-scheduler"}
status: {}
