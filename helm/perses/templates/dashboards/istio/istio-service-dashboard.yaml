              thresholds:
                defaultColor: green
                mode: absolute
                steps:
                - color: green
                  value: 0
                - color: red
                  value: 80
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus-datasource
                  query: "round(\n  sum(irate(istio_requests_total{destination_service=~\"$service\",reporter=~\"\
                    $qrep\"}[5m])),\n  0.001\n)"
