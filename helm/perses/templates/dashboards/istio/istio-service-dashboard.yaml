                  query: "round(\n  sum by (destination_workload, destination_workload_namespace) (\n\
                    \    irate(\n      istio_tcp_sent_bytes_total{connection_security_policy=\"mutual_tls\"\
                    ,destination_service=~\"$service\",destination_workload=~\"$dstwl\",destination_workload_namespace=~\"\
                    $dstns\",reporter=\"destination\"}[1m]\n    )\n  ),\n  0.001\n)"
                  seriesNameFormat: "{{"{{"}} destination_workload {{"}}"}}.{{"{{"}}destination_workload_namespace {{"}}"}} (\U0001F510\
                    mTLS)"
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus-datasource
                  query: "round(\n  sum by (destination_workload, destination_workload_namespace) (\n\
                    \    irate(\n      istio_tcp_sent_bytes_total{connection_security_policy!=\"mutual_tls\"\
                    ,destination_service=~\"$service\",destination_workload=~\"$dstwl\",destination_workload_namespace=~\"\
                    $dstns\",reporter=\"destination\"}[1m]\n    )\n  ),\n  0.001\n)"
                  seriesNameFormat: '{{"{{"}} destination_workload {{"}}"}}.{{"{{"}}destination_workload_namespace {{"}}"}}'
