                  query: "  sum(\n    irate(\n      istio_requests_total{destination_service=~\"$service\"\
                    ,reporter=~\"$qrep\",response_code!~\"5.*\"}[5m]\n    )\n  )\n/\n    sum(irate(istio_requests_total{destination_service=~\"\
                    $service\",reporter=~\"$qrep\"}[5m]))\n  or on ()\n    vector(1)"
