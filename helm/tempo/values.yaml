# Tempo (traces) - single-binary (monolithic) chart, filesystem storage.
#
# The grafana/tempo chart (as opposed to tempo-distributed) is already a
# monolithic single-binary deployment. Alloy pushes OTLP here.
#
# Write path (Alloy OTLP): tempo:4317 (gRPC) / tempo:4318 (HTTP)
# Read  path (Grafana):    http://tempo:3200

replicas: 1

tempo:
  # Serve TraceQL results (search + metrics) over HTTP streaming. Grafana's
  # Tempo datasource and the Traces Drilldown app use this for the metrics API.
  streamOverHttpEnabled: true
  # Expose Tempo's own MCP server (Streamable HTTP, at /api/mcp on the query
  # port 3200) so an AI agent could query traces directly. Not wired into
  # Grafana's Graft assistant today (which uses Grafana's in-process MCP), but
  # left enabled for any MCP-capable client that wants trace access.
  queryFrontend:
    mcp_server:
      enabled: true
  # Enable the OTLP receivers (gRPC + HTTP) so Alloy can forward traces.
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
  # Local filesystem storage for a single node.
  storage:
    trace:
      backend: local
      local:
        path: /var/tempo/traces
      wal:
        path: /var/tempo/wal
  # Generate service-graph and span metrics and remote-write them to Mimir
  # so the demo shows the traces->metrics correlation out of the box.
  #
  # TraceQL metrics (`{ } | rate()` etc.) - what the query-less Traces
  # Drilldown app renders its RED views from - need no generator processor in
  # Tempo 3.x: the live-store builds the blocks those queries read on its own
  # (Tempo 2.x needed the `local-blocks` processor for this, which 3.0 removed).
  metricsGenerator:
    enabled: true
    remoteWriteUrl: "http://mimir-gateway.observability.svc.cluster.local/api/v1/push"
  resources:
    requests: { cpu: 100m, memory: 256Mi }

  # Which metrics-generator processors run. This chart reads the active
  # processor list from `tempo.overrides.defaults` - a top-level
  # `global_overrides` key is silently ignored, which is why the generator
  # produced nothing before.
  overrides:
    defaults:
      metrics_generator:
        processors:
          - service-graphs
          - span-metrics

persistence:
  enabled: true
  size: 5Gi

# Emit a ServiceMonitor so kube-prometheus-stack's Prometheus scrapes Tempo
# (Tempo serves /metrics on its HTTP port 3200).
serviceMonitor:
  enabled: true
