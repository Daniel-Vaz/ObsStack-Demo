# kube-prometheus-stack — Alertmanager, the Prometheus Operator,
# kube-state-metrics and node-exporter. (+ Prometheus itself, in the
# METRICS_MODE=prometheus toggle — see values-prometheus-metrics.yaml.)
#
# Default (METRICS_MODE=alloy): Prometheus itself is NOT deployed. The
# Operator stays only to own the CRDs (ServiceMonitor/PodMonitor/PrometheusRule)
# that every other chart's values reference — Alloy (helm/alloy/values.yaml)
# reads those CRDs directly with its own Kubernetes client, scrapes, and
# remote-writes to Mimir, and syncs PrometheusRules into Mimir's ruler, which
# evaluates them and fires to the Alertmanager deployed here.
#
# Toggle METRICS_MODE=prometheus restores the original as-is architecture:
# Prometheus itself scrapes and evaluates rules — see
# values-prometheus-metrics.yaml.
#
# Grafana and the Windows exporter are intentionally NOT deployed here: Grafana
# comes from its own grafana-community chart, and there are no Windows nodes.

# ---- Grafana: disabled (deployed separately from grafana-community/grafana) ----
grafana:
  enabled: false
  forceDeployDashboards: true

# ---- Windows exporter: disabled (no Windows nodes in this demo) ----
windowsMonitoring:
  enabled: false

# ---- kube-state-metrics (cluster object state) ----
kubeStateMetrics:
  enabled: true
kube-state-metrics:                     # subchart resource tuning
  resources:
    requests: { cpu: 25m, memory: 64Mi }

# ---- node-exporter (per-node hardware/OS metrics) ----
nodeExporter:
  enabled: true
prometheus-node-exporter:               # subchart resource tuning
  resources:
    requests: { cpu: 25m, memory: 32Mi }

# ---- Prometheus Operator ----
prometheusOperator:
  enabled: true
  resources:
    requests: { cpu: 50m, memory: 128Mi }

# ---- Control-plane component monitors: disabled ----
# kind doesn't expose kube-controller-manager / scheduler / etcd / kube-proxy
# metrics on a scrapeable interface, so these ServiceMonitors would sit
# permanently "down". Turn them off to keep the target list clean.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false

# ---- Alertmanager ----
alertmanager:
  enabled: true
  # Expose the Alertmanager UI to the host as a NodePort, the same way Grafana
  # and Alloy are exposed. The kind node maps hostPort 9093 -> containerPort
  # 30093 (see kind/cluster.yaml extraPortMappings), so it's reachable at
  # http://localhost:9093.
  service:
    type: NodePort
    nodePort: 30093
  # Route *every* alert through a single catch-all receiver by default. The
  # chart's stock config sends everything to a "null" receiver and carves out a
  # separate Watchdog route; here we collapse that into one catch-all so no
  # alert is ever dropped or filtered out before it reaches Alertmanager's
  # alert store. That matters because whatever reads Alertmanager's alert set
  # — Grafana Alerting via the Mimir datasource by default, or Karma
  # (`make karma`) in the METRICS_MODE=prometheus toggle — polls straight from
  # Alertmanager's API, so this default route is what guarantees all firing
  # alerts, of every severity and from every namespace, are visible there.
  config:
    route:
      group_by: ['alertname', 'namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: catch-all
      # Explicitly empty. Helm deep-merges this `config` onto the chart's
      # defaults, and the stock config ships a sub-route sending Watchdog to a
      # "null" receiver — which our `receivers` below no longer defines. Left
      # unset, that stale sub-route survives the merge and Alertmanager rejects
      # the config ("undefined receiver null"). Clearing it sends *everything*,
      # Watchdog included, to catch-all.
      routes: []
    receivers:
      # A receiver with no notifier config: Alertmanager still accepts, groups
      # and stores every alert (so Karma sees them) without forwarding them to
      # an external destination — there's nowhere to page in a local demo.
      - name: catch-all
  alertmanagerSpec:
    # Ephemeral for the demo (no PVC).
    storage: {}
    resources:
      requests: { cpu: 25m, memory: 64Mi }

# ---- Prometheus: disabled by default (Alloy scrapes instead — see
# helm/alloy/values.yaml). Enabled only via the values-prometheus-metrics.yaml
# overlay (METRICS_MODE=prometheus). ----
prometheus:
  enabled: false
