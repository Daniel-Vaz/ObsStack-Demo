# kube-prometheus-stack — Prometheus, Alertmanager, the Prometheus Operator,
# kube-state-metrics and node-exporter.
#
# Prometheus is now the sole metrics scraper for the whole demo. Every other
# component (Mimir/Loki/Tempo/Pyroscope/Grafana/Alloy) ships a ServiceMonitor
# from its own chart (see each helm/*/values.yaml); the operator turns those
# into scrape targets. Prometheus then remote-writes every sample to Mimir,
# which Grafana reads from. Alloy no longer touches metrics.
#
# Grafana and the Windows exporter are intentionally NOT deployed here: Grafana
# comes from its own grafana-community chart, and there are no Windows nodes.

# ---- Grafana: disabled (deployed separately from grafana-community/grafana) ----
grafana:
  enabled: false
  forceDeployDashboards: true

# ---- Windows exporter: disabled (no Windows nodes in this demo) ----
windowsMonitoring:
  enabled: false

# ---- kube-state-metrics (cluster object state) ----
kubeStateMetrics:
  enabled: true
kube-state-metrics:                     # subchart resource tuning
  resources:
    requests: { cpu: 25m, memory: 64Mi }

# ---- node-exporter (per-node hardware/OS metrics) ----
nodeExporter:
  enabled: true
prometheus-node-exporter:               # subchart resource tuning
  resources:
    requests: { cpu: 25m, memory: 32Mi }

# ---- Prometheus Operator ----
prometheusOperator:
  enabled: true
  resources:
    requests: { cpu: 50m, memory: 128Mi }

# ---- Control-plane component monitors: disabled ----
# kind doesn't expose kube-controller-manager / scheduler / etcd / kube-proxy
# metrics on a scrapeable interface, so these ServiceMonitors would sit
# permanently "down". Turn them off to keep the target list clean.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false

# ---- Alertmanager ----
alertmanager:
  enabled: true
  # Expose the Alertmanager UI to the host as a NodePort, the same way Grafana
  # and Alloy are exposed. The kind node maps hostPort 9093 -> containerPort
  # 30093 (see kind/cluster.yaml extraPortMappings), so it's reachable at
  # http://localhost:9093.
  service:
    type: NodePort
    nodePort: 30093
  # Route *every* alert through a single catch-all receiver by default. The
  # chart's stock config sends everything to a "null" receiver and carves out a
  # separate Watchdog route; here we collapse that into one catch-all so no
  # alert is ever dropped or filtered out before it reaches Alertmanager's
  # alert store. That matters because Karma (the alert dashboard, deployed by
  # `make karma`) reads the full alert set straight from Alertmanager's API —
  # so this default route is what guarantees all firing alerts, of every
  # severity and from every namespace, are visible in Karma.
  config:
    route:
      group_by: ['alertname', 'namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: catch-all
      # Explicitly empty. Helm deep-merges this `config` onto the chart's
      # defaults, and the stock config ships a sub-route sending Watchdog to a
      # "null" receiver — which our `receivers` below no longer defines. Left
      # unset, that stale sub-route survives the merge and Alertmanager rejects
      # the config ("undefined receiver null"). Clearing it sends *everything*,
      # Watchdog included, to catch-all.
      routes: []
    receivers:
      # A receiver with no notifier config: Alertmanager still accepts, groups
      # and stores every alert (so Karma sees them) without forwarding them to
      # an external destination — there's nowhere to page in a local demo.
      - name: catch-all
  alertmanagerSpec:
    # Ephemeral for the demo (no PVC).
    storage: {}
    resources:
      requests: { cpu: 25m, memory: 64Mi }

# ---- Prometheus ----
prometheus:
  enabled: true
  # Expose the Prometheus UI to the host as a NodePort (kind maps hostPort 9090
  # -> containerPort 30090; see kind/cluster.yaml), reachable at
  # http://localhost:9090.
  service:
    type: NodePort
    nodePort: 30090
  prometheusSpec:
    # By default the operator only selects ServiceMonitors/PodMonitors carrying
    # this release's label. Our backends' ServiceMonitors live in the
    # observability namespace without that label, so widen every selector to
    # match all resources in all namespaces.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}
    podMonitorSelector: {}
    podMonitorNamespaceSelector: {}

    # Scrape metric/label names using the legacy (classic Prometheus) naming
    # scheme instead of Prometheus 3.x's new UTF-8 default. With the UTF-8
    # default, Prometheus negotiates UTF-8 exposition with targets and stores
    # OTel-native dotted names verbatim (e.g. Alloy's otelcol gRPC self-metric
    # `rpc.client.call.duration_seconds_bucket`, exported by the otelgrpc
    # instrumentation). Mimir enforces classic metric names and rejects those on
    # remote_write ("received a series with invalid metric name ...
    # err-mimir-metric-name-invalid"), dropping whole scrape batches. Legacy
    # makes Prometheus request underscore-escaped names from every target, so the
    # same metric arrives as `rpc_client_call_duration_seconds_bucket` and Mimir
    # accepts it. Every other target already exposes classic names, so this is a
    # no-op for them.
    nameValidationScheme: Legacy

    # Mimir is the long-term metrics store; Prometheus keeps only a short local
    # buffer and forwards everything downstream.
    retention: 2h

    # Remote-write every scraped sample to Mimir. Grafana's metrics datasource
    # points at Mimir, so this is what makes scraped metrics queryable.
    remoteWrite:
      - url: http://mimir-gateway.observability.svc.cluster.local/api/v1/push

    resources:
      requests: { cpu: 200m, memory: 512Mi }
