# Grafana Alloy — the collector for all four signals by default
# (METRICS_MODE=alloy; see the Makefile).
#
# Runs as a DaemonSet.
#
#   Metrics : ServiceMonitors/PodMonitors (Operator CRDs), scraped directly -> Mimir
#             PrometheusRules (Operator CRDs), synced                       -> Mimir's ruler
#   Logs    : all pod stdout/stderr (via the Kubernetes API)  -> Loki
#             + OTLP in on :4317/:4318 (e.g. kagent)          -> Loki
#   Traces  : OTLP in on :4317 (gRPC) / :4318 (HTTP)          -> Tempo
#   Profiles: pods annotated  pyroscope.io/scrape: "true"     -> Pyroscope
#
# Alloy needs no extra RBAC for this: the chart's default ClusterRole already
# grants get/list/watch on servicemonitors/podmonitors/prometheusrules
# (monitoring.coreos.com). Those CRDs are installed by kube-prometheus-stack's
# Operator (still deployed for that reason — see
# helm/kube-prometheus-stack/values.yaml); Alloy reads them directly with its
# own Kubernetes client, without needing the Operator's reconcile loop.
#
# Toggle METRICS_MODE=prometheus hands metrics back to kube-prometheus-stack's
# own Prometheus — see values-prometheus-metrics.yaml, which replaces the
# config below with a metrics-free version of the same pipeline.

controller:
  type: daemonset

# Emit a ServiceMonitor so kube-prometheus-stack's Prometheus scrapes Alloy's
# own metrics (served on :12345/metrics).
serviceMonitor:
  enabled: true

# Expose only the Alloy UI to the host as a NodePort. The kind node maps
# hostPort 12345 -> containerPort 30345 (see kind/cluster.yaml extraPortMappings),
# so the UI is reachable at http://localhost:12345. The OTLP receiver ports stay
# cluster-internal — demo apps push to them via the in-cluster Service DNS.
service:
  type: NodePort
  nodePort: 30345   # UI / http-metrics (port 12345)

alloy:
  # OTLP receivers need to be reachable from other pods.
  listenAddr: 0.0.0.0

  # Expose the OTLP receiver ports on the Alloy service (cluster-internal;
  # reachable at alloy.observability.svc.cluster.local:4317 / :4318).
  extraPorts:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP

  resources:
    requests: { cpu: 100m, memory: 128Mi }

  configMap:
    content: |
      // ========================================================================
      // Shared Kubernetes pod discovery
      // ========================================================================
      discovery.kubernetes "pods" {
        role = "pod"
      }

      // ========================================================================
      // METRICS  ->  Mimir
      // Discovers ServiceMonitor/PodMonitor objects straight from the
      // Prometheus-Operator CRDs (installed by kube-prometheus-stack) and
      // scrapes their targets directly -- these components both discover and
      // scrape, unlike discovery.kubernetes above. Omitting namespaces/selector
      // on each means "every namespace, every ServiceMonitor/PodMonitor".
      // ========================================================================
      prometheus.remote_write "mimir" {
        endpoint {
          url = "http://mimir-gateway.observability.svc.cluster.local/api/v1/push"
        }
      }

      prometheus.operator.servicemonitors "services" {
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      prometheus.operator.podmonitors "pods" {
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      // Syncs PrometheusRule objects (every namespace) into Mimir's ruler,
      // which evaluates them and fires to the kube-prometheus-stack
      // Alertmanager (see helm/mimir/values.yaml ruler.alertmanager_url).
      mimir.rules.kubernetes "default" {
        address = "http://mimir-gateway.observability.svc.cluster.local"
      }

      // ========================================================================
      // LOGS  ->  Loki
      // Tails every pod's stdout/stderr through the Kubernetes API.
      // (Single-node demo: one DaemonSet pod tails all logs. On multi-node
      //  clusters enable clustering to avoid duplicate tailing.)
      // ========================================================================
      discovery.relabel "logs_pods" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "node"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }
      }

      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.logs_pods.output
        forward_to = [loki.process.trace_ids.receiver]
      }

      // Parse the slog JSON body and promote the trace/span ids to structured
      // metadata. Grafana's Loki<->Tempo correlation looks for `trace_id`
      // (and `span_id`), which is exactly what the app logs. Structured metadata
      // keeps these high-cardinality values queryable without indexing them as
      // stream labels.
      loki.process "trace_ids" {
        forward_to = [loki.write.default.receiver]

        stage.json {
          expressions = {
            trace_id = "trace_id",
            span_id  = "span_id",
          }
        }

        stage.structured_metadata {
          values = {
            trace_id = "trace_id",
            span_id  = "span_id",
          }
        }
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.observability.svc.cluster.local:3100/loki/api/v1/push"
        }
      }

      // ========================================================================
      // TRACES  ->  Tempo
      // Receives OTLP from demo apps, batches, and exports to Tempo.
      // ========================================================================
      otelcol.receiver.otlp "default" {
        grpc {
          endpoint = "0.0.0.0:4317"
        }
        http {
          endpoint = "0.0.0.0:4318"
        }
        output {
          traces = [otelcol.processor.batch.default.input]
          logs   = [otelcol.processor.attributes.otlp_logs.input]
        }
      }

      otelcol.processor.batch "default" {
        output {
          traces = [otelcol.exporter.otlp.tempo.input]
        }
      }

      otelcol.exporter.otlp "tempo" {
        client {
          endpoint = "tempo.observability.svc.cluster.local:4317"
          tls {
            insecure = true
          }
        }
      }

      // ========================================================================
      // OTLP LOGS  ->  Loki
      // kagent (helm/kagent/values.yaml) emits its own logs over OTLP rather
      // than only stdout, using the same receiver as traces above. Promote
      // service.name/service.namespace resource attributes to Loki labels
      // (otelcol.exporter.loki needs the "loki.resource.labels" hint --
      // it doesn't map OTLP attributes to labels on its own) and forward into
      // the same Loki write path pod logs already use.
      // ========================================================================
      otelcol.processor.attributes "otlp_logs" {
        action {
          key    = "loki.resource.labels"
          action = "insert"
          value  = "service.name, service.namespace"
        }
        output {
          logs = [otelcol.exporter.loki.default.input]
        }
      }

      otelcol.exporter.loki "default" {
        forward_to = [loki.write.default.receiver]
      }

      // ========================================================================
      // PROFILES  ->  Pyroscope
      // Scrapes pprof endpoints of pods annotated pyroscope.io/scrape=true.
      // ========================================================================
      discovery.relabel "profiles_pods" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_pod_annotation_pyroscope_io_scrape"]
          regex         = "true"
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "service_name"
        }
      }

      pyroscope.scrape "pods" {
        targets    = discovery.relabel.profiles_pods.output
        forward_to = [pyroscope.write.default.receiver]
      }

      pyroscope.write "default" {
        endpoint {
          url = "http://pyroscope.observability.svc.cluster.local:4040"
        }
      }
