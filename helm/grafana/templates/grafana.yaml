# Provisioning config for the file-based dashboard provider the k8s-sidecar
# container (below) feeds. Mirrors the upstream grafana-operator
# "configmaps_sidecar" example almost verbatim.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "grafana.fullname" . }}-dashboards-provisioning
  labels:
    {{- include "grafana.labels" . | nindent 4 }}
data:
  provisioning.yaml: |-
    apiVersion: 1
    providers:
      - name: 'configmap-dashboard-provider'
        orgId: 1
        folder: ''
        folderUid: ''
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        allowUiUpdates: false
        options:
          path: /var/lib/grafana/dashboards
          foldersFromFilesStructure: true
{{- if or .Values.llm.enabled .Values.graft.enabled }}
---
# File-based app-plugin provisioning, mounted at
# /etc/grafana/provisioning/plugins below (the same ConfigMap mechanism this
# chart uses for dashboards). Configures/enables the AI plugins installed via
# GF_INSTALL_PLUGINS. See the `llm` and `graft` blocks in values.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "grafana.fullname" . }}-plugins-provisioning
  labels:
    {{- include "grafana.labels" . | nindent 4 }}
data:
  {{- if .Values.llm.enabled }}
  # Point the LLM app at its model provider (Azure AI Foundry by default, or
  # this stack's in-cluster Ollama in LLM_BACKEND=ollama - see values.yaml and
  # values-ollama-llm.yaml). Provider "custom" = OpenAI wire format; the
  # plugin appends "/v1" to the url.
  grafana-llm-app.yaml: |-
    apiVersion: 1
    apps:
      - type: grafana-llm-app
        disabled: false
        jsonData:
          provider: custom
          openAI:
            url: {{ .Values.llm.url | quote }}
          models:
            default: base
            mapping:
              base: {{ .Values.llm.model | quote }}
              large: {{ .Values.llm.model | quote }}
        {{- if .Values.llm.apiKey }}
        secureJsonData:
          openAIKey: {{ .Values.llm.apiKey | quote }}
        {{- end }}
  {{- end }}
  {{- if .Values.graft.enabled }}
  # Enable the Graft app so it's on by default (it reads its LLM backend from
  # the grafana-llm-app plugin above; configure models/MCP in its UI).
  vikshana-graft-app.yaml: |-
    apiVersion: 1
    apps:
      - type: vikshana-graft-app
        disabled: false
  {{- end }}
{{- end }}
---
apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: {{ include "grafana.fullname" . }}
  labels:
    {{- include "grafana.labels" . | nindent 4 }}
    {{- include "grafana.instanceSelectorLabels" . | nindent 4 }}
spec:
  config:
    log:
      mode: "console"
    security:
      admin_user: {{ .Values.adminUser | quote }}
      admin_password: {{ .Values.adminPassword | quote }}
    {{- if .Values.graft.enabled }}
    plugins:
      # Graft (vikshana-graft-app) is unsigned; Grafana refuses to load unsigned
      # plugins unless their id is explicitly allow-listed here.
      allow_loading_unsigned_plugins: vikshana-graft-app
    {{- end }}

  # Exposed to the host as a NodePort. Note the generated Service is named
  # "<release>-service" (an Operator naming convention, not this chart's
  # choice) - see scripts/validate.sh, which references it by that name.
  service:
    spec:
      type: NodePort
      ports:
        - name: grafana
          protocol: TCP
          port: 3000
          targetPort: grafana-http
          nodePort: {{ .Values.service.nodePort }}

  deployment:
    spec:
      template:
        spec:
          # The k8s-sidecar watches every namespace for
          # ConfigMaps labelled grafana_dashboard=1 (how kube-prometheus-stack
          # ships its bundled default dashboards) and drops each as a JSON
          # file under /var/lib/grafana/dashboards, which Grafana's own
          # file-based provisioner (config'd via the ConfigMap above) loads.
          volumes:
            - name: sidecar-dashboards
              emptyDir: {}
            - name: dashboards-provisioning
              configMap:
                name: {{ include "grafana.fullname" . }}-dashboards-provisioning
            {{- if or .Values.llm.enabled .Values.graft.enabled }}
            - name: plugins-provisioning
              configMap:
                name: {{ include "grafana.fullname" . }}-plugins-provisioning
            {{- end }}
          containers:
            - name: grafana
              {{- /* Build the GF_INSTALL_PLUGINS list: catalog id for the LLM
                     plugin, and a "<url>;<id>" entry for Graft (not in the
                     catalog). The grafana container installs each at startup,
                     before Grafana boots. */ -}}
              {{- $plugins := list }}
              {{- if .Values.llm.enabled }}
              {{- $plugins = append $plugins "grafana-llm-app" }}
              {{- end }}
              {{- if .Values.graft.enabled }}
              {{- $plugins = append $plugins (printf "%s;vikshana-graft-app" .Values.graft.pluginUrl) }}
              {{- end }}
              {{- if $plugins }}
              env:
                - name: GF_INSTALL_PLUGINS
                  value: {{ join "," $plugins | quote }}
                - name: GF_AUTH_MANAGED_SERVICE_ACCOUNTS_ENABLED
                  value: "true"
                - name: GF_FEATURE_TOGGLES_ENABLE
                  value: "externalServiceAccounts"
              {{- end }}
              volumeMounts:
                - name: sidecar-dashboards
                  mountPath: /var/lib/grafana/dashboards
                - name: dashboards-provisioning
                  mountPath: /etc/grafana/provisioning/dashboards
                {{- if or .Values.llm.enabled .Values.graft.enabled }}
                - name: plugins-provisioning
                  mountPath: /etc/grafana/provisioning/plugins
                {{- end }}
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
            - name: k8s-sidecar
              image: {{ .Values.sidecar.image }}
              env:
                - name: LABEL
                  value: grafana_dashboard
                - name: LABEL_VALUE
                  value: "1"
                - name: FOLDER
                  value: /var/lib/grafana/dashboards
                - name: NAMESPACE
                  value: ALL
                - name: RESOURCE
                  value: configmap
              volumeMounts:
                - name: sidecar-dashboards
                  mountPath: /var/lib/grafana/dashboards
              resources:
                {{- toYaml .Values.sidecar.resources | nindent 16 }}
