# A Grafana-side (application-level) service account + token for kagent's
# grafana-mcp — see the "grafanaMcp" note in values.yaml. The Operator
# reconciles this into a real Grafana service account, generates a token,
# and writes it to the "kagent-grafana-mcp-token" Secret — fully declarative,
# no bootstrap script involved.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaServiceAccount
metadata:
  name: {{ .Values.grafanaMcp.serviceAccountName }}
  labels:
    {{- include "grafana.labels" . | nindent 4 }}
spec:
  name: {{ .Values.grafanaMcp.serviceAccountName }}
  instanceName: {{ include "grafana.fullname" . }}
  role: Editor
  tokens:
    - name: kagent-mcp-token
      secretName: {{ .Values.grafanaMcp.tokenSecretName }}
