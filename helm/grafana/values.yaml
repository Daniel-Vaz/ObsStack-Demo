# Grafana - deployed and managed by the Grafana Operator
# (https://github.com/grafana/grafana-operator) via CRDs (see templates/).
# Requires helm/grafana-operator installed first (the CRDs' owner) - see the
# Makefile's `grafana-operator` -> `grafana` ordering.
#
# Login: admin / admin (demo only). Reach the UI with `make grafana-ui`.

adminUser: admin
adminPassword: admin

# Exposed to the host as a NodePort. The kind node maps hostPort 3000 ->
# containerPort 30000 (see kind/cluster.yaml extraPortMappings), so the UI is
# reachable at http://localhost:3000 with no port-forward. Unlike this repo's
# other NodePort UIs, the backing Service isn't named after the release -
# it's "<release>-service" (grafana-service), a grafana-operator naming
# convention this chart doesn't control (see scripts/validate.sh).
service:
  nodePort: 30000

resources:
  requests: { cpu: 100m, memory: 128Mi }

# k8s-sidecar watches every namespace for ConfigMaps labelled
# grafana_dashboard=1 - this is how kube-prometheus-stack's bundled default
# dashboards reach Grafana - and materializes them as dashboard JSON files
# under a directory Grafana's own file-based provisioner reads (see
# templates/grafana.yaml).
sidecar:
  image: quay.io/kiwigrid/k8s-sidecar:2.8.1
  resources:
    requests: { cpu: 25m, memory: 32Mi }

# Provisioned datasources for all four signals, with cross-signal
# correlations. One GrafanaDatasource CR per entry (see
# templates/datasources.yaml) - access is always "proxy", hardcoded there.
datasources:
  - name: Mimir
    uid: mimir
    type: prometheus
    url: http://mimir-gateway.observability.svc.cluster.local/prometheus
    isDefault: true
    jsonData:
      prometheusType: Mimir
      timeInterval: 15s
      # Mimir's ruler is enabled (see helm/mimir/values.yaml) - Alloy syncs
      # PrometheusRules into it and it evaluates them against the
      # kube-prometheus-stack Alertmanager, so let Grafana Alerting manage/show
      # those rules too. The values-prometheus-metrics.yaml overlay sets this to
      # false for the METRICS_MODE=prometheus mode, where the ruler is disabled
      # and this probe would otherwise 502.
      manageAlerts: true
      # metrics -> traces. Renders exemplars as clickable dots on a graph and
      # sends each one to Tempo. `name` is the *exemplar label* carrying the id
      # (the OTel SDK emits trace_id + span_id), and datasourceUid is where to
      # take it. This is only the last link in the chain - it needs the app to
      # serve OpenMetrics and Mimir to have exemplar storage enabled, or there
      # will simply be no dots to click. See docs/correlation.md.
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo

  - name: Loki
    uid: loki
    type: loki
    url: http://loki.observability.svc.cluster.local:3100
    jsonData:
      # Turn a "trace_id" field in logs into a link to the Tempo trace.
      derivedFields:
        - name: trace_id
          matcherRegex: '"?trace_id"?[:=]"?(\w+)"?'
          datasourceUid: tempo
          url: '${__value.raw}'

  - name: Tempo
    uid: tempo
    type: tempo
    url: http://tempo.observability.svc.cluster.local:3200
    jsonData:
      # trace -> logs (jump to Loki filtered by the trace's service)
      tracesToLogsV2:
        datasourceUid: loki
        filterByTraceID: true
        spanStartTimeShift: "-2s"
        spanEndTimeShift: "2s"
        tags:
          - key: service.name
            value: service_name
      # trace -> metrics (span/service-graph metrics live in Mimir)
      tracesToMetrics:
        datasourceUid: mimir
      # trace -> profiles (jump to the Pyroscope flame graph for the span's
      # service, around the span's own time window).
      #
      # Grafana builds the Pyroscope query out of the span: `profileTypeId`
      # picks *which* profile, `tags` maps span attributes onto Pyroscope label
      # names, and the time range is the span's start/end widened by 60s either
      # side (fixed by Grafana - there's no spanStartTimeShift here like there
      # is for tracesToLogsV2). That padding is what makes this work at all:
      # Alloy scrapes pprof every 15s, so a millisecond-long span would
      # otherwise fall between two profile samples.
      #
      # `profileTypeId` is required, not cosmetic - with it unset Grafana has no
      # valid query to run and the link lands on an empty panel. process_cpu is
      # the delta CPU profile Alloy scrapes from /debug/pprof/profile.
      #
      # The `tags` remap is the whole contract: OTel attribute keys contain
      # dots, Pyroscope label names can't. `service.name` is set by the app
      # (telemetry.Init) and `service_name` by Alloy's discovery.relabel from
      # the container name - they line up because every demo container is named
      # after its service. See docs/correlation.md.
      tracesToProfiles:
        datasourceUid: pyroscope
        profileTypeId: process_cpu:cpu:nanoseconds:cpu:nanoseconds
        tags:
          - key: service.name
            value: service_name
      serviceMap:
        datasourceUid: mimir
      nodeGraph:
        enabled: true

  - name: Pyroscope
    uid: pyroscope
    type: grafana-pyroscope-datasource
    url: http://pyroscope.observability.svc.cluster.local:4040

  # Alertmanager deployed by kube-prometheus-stack. Lets Grafana's Alerting
  # UI browse the alerts, silences and groups held in KPS's Alertmanager.
  - name: Alertmanager
    uid: alertmanager
    type: alertmanager
    url: http://kube-prometheus-stack-alertmanager.observability.svc.cluster.local:9093
    jsonData:
      implementation: prometheus
      # Let Grafana surface the alerts held in this Alertmanager.
      handleGrafanaManagedAlerts: false

# Grafana Correlations - the cross-signal jumps that have no home in a
# datasource's own jsonData. `tracesToLogsV2`/`tracesToProfiles` above only
# exist because the *Tempo* datasource has fields for them; Loki and Prometheus
# have no "link to profiles" setting, so logs->profiles and metrics->profiles
# have to be expressed as Correlations instead.
#
# These are applied by a post-install/post-upgrade Job that calls Grafana's
# Correlations API (see templates/correlations.yaml for why the Grafana Operator
# can't provision them, and docs/correlation.md for the wider picture).
#
# `config.field` names the field in the *source* result that carries the link;
# any field on that row is then available to the target query as ${field}.
correlations:
  # Logs -> profiles.
  #
  # `field` must name a real field on the Loki data frame, and a Loki log frame
  # has exactly these: labels, Time, Line, tsNs, labelTypes, id. Stream labels
  # like service_name are *inside* the `labels` map, not fields of their own -
  # so `field: service_name` matches nothing and Grafana renders no link at all
  # (it drops any link whose variables can't all be resolved). Hence `Line`,
  # which also puts the link where you'd click for it: the log row's detail.
  #
  # Grafana does inject stream labels as variables, but only for frames tagged
  # as dataplane log frames; these aren't, so ${service_name} would still be
  # undefined. A regex transformation over the line itself avoids depending on
  # that entirely: the app's slog handler writes `"service":"payment"` into
  # every line (telemetry.Init's .With("service", ...)), and `mapValue` binds
  # capture group 1 to ${service} for the target query below.
  #
  # `transformations[].field` is deliberately omitted so the transformation
  # reads whichever field the correlation is attached to. Grafana rewrites
  # `Line` to the body field name on dataplane frames, and omitting it here
  # means the transformation follows that rename instead of breaking.
  - sourceUID: loki
    targetUID: pyroscope
    label: Profiles for this service
    description: CPU flame graph for the service that emitted this log line
    config:
      field: Line
      transformations:
        - type: regex
          expression: '"service":"([^"]+)"'
          mapValue: service
      target:
        queryType: profile
        profileTypeId: process_cpu:cpu:nanoseconds:cpu:nanoseconds
        labelSelector: '{service_name="${service}"}'

  # Metrics -> profiles. Joined on `pod`: a label both sides already carry
  # verbatim (Alloy sets it on the Pyroscope side from pod discovery, and it's
  # on every scraped series), which pins the flame graph to the single replica
  # whose metric you clicked instead of averaging the service.
  #
  # >> This link only appears in Explore's *Table* view. <<
  #
  # Not a bug to fix here - it's the shape of the data. A Prometheus range query
  # returns a time-series frame whose only fields are `Time` and the metric
  # name; the labels hang off the value field rather than being fields, and
  # Grafana only injects labels as link variables for log frames. The table
  # format is the one that pivots each label into its own column, which is what
  # gives `pod` a field to attach to (Grafana's correlation code special-cases
  # that frame's `rawPrometheus` visualisation type for exactly this).
  #
  # So: run the query as **instant + Table** to use this. In the graph view the
  # equivalent route is metrics -> traces (exemplars, wired on the Mimir
  # datasource above) -> profiles, which is one extra hop but needs no view
  # switch. See docs/correlation.md.
  - sourceUID: mimir
    targetUID: pyroscope
    label: Profiles for this pod
    description: CPU flame graph for the pod behind this series (Table view)
    config:
      field: pod
      target:
        queryType: profile
        profileTypeId: process_cpu:cpu:nanoseconds:cpu:nanoseconds
        labelSelector: '{pod="${pod}"}'

# Grafana LLM app plugin (grafana-llm-app), provisioned to talk to an Azure AI
# Foundry endpoint. This gives Grafana's built-in LLM features (and the Graft
# assistant below) a hosted model provider.
# Docs: https://grafana.com/docs/grafana-cloud/machine-learning/llm/
#
# Wiring (see templates/grafana.yaml): the plugin binary is fetched at
# container start via GF_INSTALL_PLUGINS, and its provider config (including
# the API key, via secureJsonData) is delivered through file-based plugin
# provisioning - the same ConfigMap-mounted mechanism this chart already uses
# for dashboards and datasources.
#
# Provider is "custom" (OpenAI wire format). The plugin appends "/v1" (its
# default apiPath) to `url`, hitting Azure AI Foundry's OpenAI-compatible
# /v1/chat/completions.
#
# `apiKey` is set at deploy time from AZURE_LLM_API_KEY in .env (gitignored;
# see the Makefile's `grafana` target) - leave it unset here.
#
# `make up LLM_BACKEND=ollama` layers values-ollama-llm.yaml on top of this
# block to swap in this stack's in-cluster Ollama instead - see
# docs/llm-backends.md.
llm:
  enabled: true
  url: https://dvaz-tests-resource.services.ai.azure.com/openai
  # The plugin abstracts models into "base"/"large" slots; map both onto the
  # single Azure AI Foundry deployment this demo uses.
  model: gpt-5.4-mini
  apiKey: ""

# Graft - a community "AI Assistant for Grafana" app plugin
# (https://github.com/vikshana/vikshana-graft-app) that layers a natural-language
# chat UI on top of the `llm` plugin above (it uses grafana-llm-app as its model
# backend, so keep both enabled together) plus Grafana's MCP tools.
#
# Two wrinkles this handles (see templates/grafana.yaml):
#   - Not in the Grafana catalog, so it's installed from a release-zip URL
#     appended to GF_INSTALL_PLUGINS as "<url>;<plugin-id>".
#   - Unsigned, so the id is added to allow_loading_unsigned_plugins in the
#     Grafana CR config.
#
# Version note: upstream's build/publish workflow fires on `v*` tags, but
# releases are tagged `graft-v*` - so v0.2.0 is the newest tag that ships a
# prebuilt zip (the v0.3.0–v0.6.x sources have no downloadable artifact). Bump
# pluginUrl if upstream publishes newer builds.
graft:
  enabled: true
  pluginUrl: https://github.com/vikshana/vikshana-graft-app/releases/download/v0.2.0/vikshana-graft-app-v0.2.0.zip
