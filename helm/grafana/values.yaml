# Grafana — deployed and fully managed by the Grafana Operator
# (https://github.com/grafana/grafana-operator) via CRDs (see templates/),
# rather than the grafana-community/grafana Helm chart. Requires
# helm/grafana-operator installed first (the CRDs' owner) — see the
# Makefile's `grafana-operator` -> `grafana` ordering.
#
# Login: admin / admin (demo only). Reach the UI with `make grafana-ui`.

adminUser: admin
adminPassword: admin

# Exposed to the host as a NodePort. The kind node maps hostPort 3000 ->
# containerPort 30000 (see kind/cluster.yaml extraPortMappings), so the UI is
# reachable at http://localhost:3000 with no port-forward. Unlike this repo's
# other NodePort UIs, the backing Service isn't named after the release —
# it's "<release>-service" (grafana-service), a grafana-operator naming
# convention this chart doesn't control (see scripts/validate.sh).
service:
  nodePort: 30000

resources:
  requests: { cpu: 100m, memory: 128Mi }

# k8s-sidecar watches every namespace for ConfigMaps labelled
# grafana_dashboard=1 — this is how kube-prometheus-stack's bundled default
# dashboards reach Grafana — and materializes them as dashboard JSON files
# under a directory Grafana's own file-based provisioner reads (see
# templates/grafana.yaml). Same mechanism, same image, as the
# grafana-community/grafana chart's built-in `sidecar.dashboards` uses.
sidecar:
  image: quay.io/kiwigrid/k8s-sidecar:2.8.1
  resources:
    requests: { cpu: 25m, memory: 32Mi }

# Provisioned datasources for all four signals, with cross-signal
# correlations. One GrafanaDatasource CR per entry (see
# templates/datasources.yaml) — access is always "proxy", hardcoded there.
datasources:
  - name: Mimir
    uid: mimir
    type: prometheus
    url: http://mimir-gateway.observability.svc.cluster.local/prometheus
    isDefault: true
    jsonData:
      prometheusType: Mimir
      timeInterval: 15s
      # Mimir's ruler is enabled by default (METRICS_MODE=alloy; see
      # helm/mimir/values.yaml) — Alloy syncs PrometheusRules into it and it
      # evaluates them against the kube-prometheus-stack Alertmanager, so
      # let Grafana Alerting manage/show those rules too. The
      # values-prometheus-metrics.yaml overlay flips this back to false for
      # the METRICS_MODE=prometheus toggle, where the ruler is disabled and
      # this probe would otherwise 502.
      manageAlerts: true

  - name: Loki
    uid: loki
    type: loki
    url: http://loki.observability.svc.cluster.local:3100
    jsonData:
      # Turn a "trace_id" field in logs into a link to the Tempo trace.
      derivedFields:
        - name: trace_id
          matcherRegex: '"?trace_id"?[:=]"?(\w+)"?'
          datasourceUid: tempo
          url: '${__value.raw}'

  - name: Tempo
    uid: tempo
    type: tempo
    url: http://tempo.observability.svc.cluster.local:3200
    jsonData:
      # trace -> logs (jump to Loki filtered by the trace's service)
      tracesToLogsV2:
        datasourceUid: loki
        filterByTraceID: true
        spanStartTimeShift: "-2s"
        spanEndTimeShift: "2s"
        tags:
          - key: service.name
            value: service_name
      # trace -> metrics (span/service-graph metrics live in Mimir)
      tracesToMetrics:
        datasourceUid: mimir
      # trace -> profiles
      tracesToProfiles:
        datasourceUid: pyroscope
      serviceMap:
        datasourceUid: mimir
      nodeGraph:
        enabled: true

  - name: Pyroscope
    uid: pyroscope
    type: grafana-pyroscope-datasource
    url: http://pyroscope.observability.svc.cluster.local:4040

  # Alertmanager deployed by kube-prometheus-stack. Lets Grafana's Alerting
  # UI browse the alerts, silences and groups held in KPS's Alertmanager.
  - name: Alertmanager
    uid: alertmanager
    type: alertmanager
    url: http://kube-prometheus-stack-alertmanager.observability.svc.cluster.local:9093
    jsonData:
      implementation: prometheus
      # Let Grafana surface KPS/Prometheus alerts against this Alertmanager.
      handleGrafanaManagedAlerts: false

# Grafana LLM app plugin (grafana-llm-app), provisioned to talk to this stack's
# in-cluster Ollama (helm/ollama) instead of a hosted OpenAI. This gives
# Grafana's built-in LLM features (and the Graft assistant below) a local,
# key-less model provider — no external API key needed.
# Docs: https://grafana.com/docs/grafana-cloud/machine-learning/llm/
#
# Wiring (see templates/grafana.yaml): the plugin binary is fetched at
# container start via GF_INSTALL_PLUGINS, and its provider config is delivered
# through file-based plugin provisioning — the same ConfigMap-mounted
# mechanism this chart already uses for dashboards and datasources.
#
# Provider is "custom" (OpenAI wire format, but no API key required — Ollama
# exposes an OpenAI-compatible API and ignores auth). The plugin appends "/v1"
# (its default apiPath) to `url`, hitting Ollama's /v1/chat/completions.
llm:
  enabled: true
  # Bare Service URL for helm/ollama (the plugin adds "/v1").
  url: http://ollama.observability.svc.cluster.local:11434
  # The plugin abstracts models into "base"/"large" slots; map both onto the
  # single model Ollama serves in this demo (see helm/ollama/values.yaml).
  model: llama3.1:8b

# Graft — a community "AI Assistant for Grafana" app plugin
# (https://github.com/vikshana/vikshana-graft-app) that layers a natural-language
# chat UI on top of the `llm` plugin above (it uses grafana-llm-app as its model
# backend, so keep both enabled together) plus Grafana's MCP tools.
#
# Two wrinkles this handles (see templates/grafana.yaml):
#   - Not in the Grafana catalog, so it's installed from a release-zip URL
#     appended to GF_INSTALL_PLUGINS as "<url>;<plugin-id>".
#   - Unsigned, so the id is added to allow_loading_unsigned_plugins in the
#     Grafana CR config.
#
# Version note: upstream's build/publish workflow only fires on legacy `v*`
# tags, but releases are now tagged `graft-v*` — so v0.2.0 is the newest tag
# that actually ships a prebuilt zip (the v0.3.0–v0.6.x sources have no
# downloadable artifact). Bump pluginUrl if/when upstream publishes newer
# builds again.
graft:
  enabled: true
  pluginUrl: https://github.com/vikshana/vikshana-graft-app/releases/download/v0.2.0/vikshana-graft-app-v0.2.0.zip
