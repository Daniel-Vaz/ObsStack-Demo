# Overlay applied on top of values.yaml only when METRICS_MODE=prometheus
# (see the Makefile and docs/metrics-modes.md). `datasources` is a YAML list,
# and Helm replaces whole lists on override rather than merging by entry - so
# this overlay must repeat the *entire* datasources list, not just the one field
# that changes. The only difference from values.yaml is the Mimir entry's
# `manageAlerts: false`: in this mode, Mimir's ruler is disabled
# (helm/mimir/values-prometheus-metrics.yaml), so Grafana Alerting must not
# probe/manage rules against it (that would 502).
datasources:
  - name: Mimir
    uid: mimir
    type: prometheus
    url: http://mimir-gateway.observability.svc.cluster.local/prometheus
    isDefault: true
    jsonData:
      prometheusType: Mimir
      timeInterval: 15s
      manageAlerts: false

  - name: Loki
    uid: loki
    type: loki
    url: http://loki.observability.svc.cluster.local:3100
    jsonData:
      derivedFields:
        - name: trace_id
          matcherRegex: '"?trace_id"?[:=]"?(\w+)"?'
          datasourceUid: tempo
          url: '${__value.raw}'

  - name: Tempo
    uid: tempo
    type: tempo
    url: http://tempo.observability.svc.cluster.local:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        filterByTraceID: true
        spanStartTimeShift: "-2s"
        spanEndTimeShift: "2s"
        tags:
          - key: service.name
            value: service_name
      tracesToMetrics:
        datasourceUid: mimir
      tracesToProfiles:
        datasourceUid: pyroscope
      serviceMap:
        datasourceUid: mimir
      nodeGraph:
        enabled: true

  - name: Pyroscope
    uid: pyroscope
    type: grafana-pyroscope-datasource
    url: http://pyroscope.observability.svc.cluster.local:4040

  - name: Alertmanager
    uid: alertmanager
    type: alertmanager
    url: http://kube-prometheus-stack-alertmanager.observability.svc.cluster.local:9093
    jsonData:
      implementation: prometheus
      handleGrafanaManagedAlerts: false
