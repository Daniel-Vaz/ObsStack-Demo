# Pyroscope (profiles) — monolithic single binary, minimal footprint.
#
# The chart runs the "all" target as a single StatefulSet by default; we just
# keep it at one replica and disable the bundled Alloy subchart (we ship our
# own Alloy) and the PodDisruptionBudget (pointless with one replica).
#
# Write + read path: http://pyroscope:4040

pyroscope:
  replicaCount: 1

  # Keep memory bounded on a small node by flushing blocks more often.
  extraArgs:
    pyroscopedb.max-block-duration: 30m

  persistence:
    enabled: true
    size: 5Gi

  podDisruptionBudget:
    enabled: false

  resources:
    requests: { cpu: 100m, memory: 256Mi }

# We collect/forward profiles with our own Alloy DaemonSet, not the bundled one.
alloy:
  enabled: false
agent:
  enabled: false

minio:
  enabled: false

# Emit a ServiceMonitor so kube-prometheus-stack's Prometheus scrapes Pyroscope
# (Pyroscope serves /metrics on its HTTP port 4040).
serviceMonitor:
  enabled: true
