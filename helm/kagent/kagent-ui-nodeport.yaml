# Supplementary NodePort Service for the kagent UI, applied alongside the
# kagent chart (see the Makefile's `kagent` target: `kubectl apply -f` after
# `helm upgrade --install`).
#
# The kagent chart's own UI Service template only supports `type` — no
# pinned-nodePort field like this repo's other charts — so it can't get a
# static kind extraPortMapping by setting a Helm value. This Service is a
# second, independent Service selecting the exact same pods (same selector
# labels as the chart-managed "kagent-ui" ClusterIP Service; verify against
# `kubectl get svc kagent-ui -o yaml` if the chart's label scheme ever
# changes), exposed as NodePort instead. The kind node maps hostPort 8090 ->
# containerPort 30890 (see kind/cluster.yaml extraPortMappings), so the UI is
# reachable at http://localhost:8090 with no port-forward, same as every
# other UI in this repo.
apiVersion: v1
kind: Service
metadata:
  name: kagent-ui-nodeport
  namespace: observability
  labels:
    app.kubernetes.io/name: kagent
    app.kubernetes.io/component: ui
    app.kubernetes.io/instance: kagent
spec:
  type: NodePort
  selector:
    app.kubernetes.io/component: ui
    app.kubernetes.io/instance: kagent
    app.kubernetes.io/name: kagent
  ports:
    - name: ui
      port: 8080
      targetPort: 8080
      nodePort: 30890
